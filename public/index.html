<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MigMaster Roll</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}.card{background:#121a2d;border:1px solid #263454;border-radius:14px;padding:14px;margin-bottom:14px}h1{margin:0 0 12px;font-size:22px}h2{font-size:15px;margin:0 0 10px}input,button{height:42px;border-radius:9px;border:1px solid #33446c;background:#0d1425;color:#fff;padding:0 12px;font-size:14px}input{width:100%}button{cursor:pointer;font-weight:700}button:hover{filter:brightness(1.15)}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;margin-bottom:8px;align-items:center}.num{color:#91a4cf;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.status{font-size:12px;color:#9fb0d5;margin-top:10px;min-height:18px}.list{max-height:280px;overflow:auto}.item{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #263454;font-size:13px}.ready{color:#65e6a7}.error{color:#ff8290}.roll{font-size:16px;width:100%;height:48px}.small{font-size:12px;color:#8fa1c7}.danger{border-color:#693544}.login-indicator{display:inline-flex;align-items:center;gap:7px;font-size:12px;margin-left:8px;color:#9fb0d5}.dot{width:9px;height:9px;border-radius:50%;background:#6b7280}.dot.online{background:#65e6a7}.dot.busy{background:#f5c451}.dot.offline{background:#ff8290}@media(max-width:600px){.row{grid-template-columns:35px 1fr}.row input:last-child{grid-column:2}.grid{grid-template-columns:1fr}}</style></head><body><main>
<div class="card"><h1>MigMaster Roll <span class="login-indicator"><span id="loginDot" class="dot"></span><span id="loginText">Belum login</span></span></h1><div class="small">Array WebSocket mengikuti jumlah User ID yang diload.</div></div>
<div class="card"><h2>User ID</h2><div id="accounts"></div><input id="fileInput" type="file" accept="application/json,.json" hidden><div class="actions"><button id="add">TAMBAH ID</button><button id="save">SAVE FILE</button><button id="load">LOAD FILE</button><button id="login">LOGIN</button><button id="logout" class="danger">LOGOUT</button></div><div class="small" style="margin-top:8px">SAVE membuat file JSON. LOAD membaca kembali file JSON yang sudah disimpan.</div><div id="status" class="status"></div></div>
<div class="card"><h2>Room</h2><div class="grid"><input id="room" placeholder="Nama room"><input id="delay" type="number" min="0" value="1000" placeholder="Delay ms"></div><div class="actions" style="margin-top:8px"><button id="enter">ENTER ROOM</button><button id="leave">LEAVE ROOM</button></div></div>
<div class="card"><h2>CommandBox</h2><button id="roll" class="roll">ROLL</button><div class="small" style="margin-top:8px">ROLL: WebSocket 1 enter → leave → WebSocket 2 enter → leave → berulang. Tekan lagi untuk STOP.</div><div id="rollstate" class="status"></div></div>
<div class="card"><h2>WebSocket Array</h2><div id="wslist" class="list"></div></div>
</main><script>
const $=id=>document.getElementById(id);let accounts=[];let rollRunning=false;let rollAbort=false;
function setLoginState(state,text){$('loginDot').className='dot '+state;$('loginText').textContent=text}
function renderInputs(){const box=$('accounts');box.innerHTML='';accounts.forEach((a,i)=>{const r=document.createElement('div');r.className='row';const n=document.createElement('div');n.className='num';n.textContent=i+1;const u=document.createElement('input');u.placeholder='Username';u.value=a.username||'';u.oninput=()=>accounts[i].username=u.value;const p=document.createElement('input');p.type='password';p.placeholder='Password';p.value=a.password||'';p.oninput=()=>accounts[i].password=p.value;r.append(n,u,p);box.appendChild(r)})}
function renderStatus(list){$('wslist').innerHTML=(list||[]).map((a,i)=>`<div class="item"><span>WebSocket ${i+1} — ${escapeHtml(a.username||'')}</span><span class="${a.status==='ready'?'ready':'error'}">${escapeHtml(a.status||'')}</span></div>`).join('')||'<div class="small">Belum ada WebSocket.</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveFile(){const data={version:1,exportedAt:new Date().toISOString(),accounts};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`migmaster-roll-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=`File berhasil dibuat: ${accounts.length} User ID.`}
function loadFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const list=Array.isArray(data)?data:data.accounts;if(!Array.isArray(list))throw new Error('Format file tidak valid');accounts=list.slice(0,50).map(a=>({username:String(a?.username||''),password:String(a?.password||'')}));renderInputs();$('status').textContent=`File berhasil diload: ${accounts.length} User ID.`}catch(e){$('status').textContent='Gagal membaca file: format JSON tidak valid.'}finally{$('fileInput').value=''}};reader.onerror=()=>{$('status').textContent='File gagal dibaca.'};reader.readAsText(file)}
$('add').onclick=()=>{if(accounts.length>=50){$('status').textContent='Maksimal 50 User ID.';return}accounts.push({username:'',password:''});renderInputs()};$('save').onclick=saveFile;$('load').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>loadFile(e.target.files[0]);
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({ok:false,error:'Respons server tidak valid'}));if(!r.ok||j.ok===false)throw new Error(j.error||'Permintaan gagal');return j}
$('login').onclick=async()=>{const valid=accounts.filter(a=>a.username.trim());if(!valid.length){$('status').textContent='Tambahkan minimal satu User ID.';return}setLoginState('busy','Sedang login...');$('login').disabled=true;try{$('status').textContent='Membuka WebSocket sesuai jumlah User ID...';const j=await api('/api/accounts',{accounts:valid});renderStatus(j.accounts);const ready=j.accounts.filter(a=>a.status==='ready').length;setLoginState(ready?'online':'offline',ready?`${ready} WebSocket online`:'Login gagal');$('status').textContent=`${ready}/${j.count} WebSocket berhasil login.`}catch(e){setLoginState('offline','Login gagal');$('status').textContent='Login gagal: '+e.message}finally{$('login').disabled=false}};
$('logout').onclick=async()=>{try{await api('/api/close');renderStatus([]);setLoginState('offline','Belum login');$('status').textContent='Semua WebSocket ditutup.'}catch(e){$('status').textContent=e.message}};
async function roomAction(action){const room=$('room').value.trim();if(!room){$('status').textContent='Isi nama room.';return}try{const j=await api('/api/room',{action,room});$('status').textContent=`${action.toUpperCase()}: ${j.sent||0} WebSocket dikirim.${j.failed?` ${j.failed} gagal.`:''}`}catch(e){$('status').textContent=`${action.toUpperCase()} gagal: ${e.message}`}}
$('enter').onclick=()=>roomAction('join');$('leave').onclick=()=>roomAction('leave');const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms)));
$('roll').onclick=async()=>{if(rollRunning){rollAbort=true;$('roll').disabled=true;$('rollstate').textContent='Menghentikan ROLL...';return}const room=$('room').value.trim();if(!room){$('rollstate').textContent='Isi nama room terlebih dahulu.';return}let arr=[];try{const s=await fetch('/api/status').then(r=>r.json());arr=(s.accounts||[]).filter(a=>a.status==='ready');if(!arr.length){$('rollstate').textContent='Belum ada WebSocket yang siap/login.';return}}catch(e){$('rollstate').textContent='Gagal membaca status WebSocket.';return}rollRunning=true;rollAbort=false;$('roll').textContent='STOP ROLL';const delay=Number($('delay').value)||0;let i=0;try{while(!rollAbort){const a=arr[i];$('rollstate').textContent=`WebSocket ${i+1}/${arr.length}: ENTER`;await api('/api/roll/send',{sessionId:a.id,room,action:'join'});await sleep(delay);if(rollAbort)break;$('rollstate').textContent=`WebSocket ${i+1}/${arr.length}: LEAVE`;await api('/api/roll/send',{sessionId:a.id,room,action:'leave'});await sleep(delay);i=(i+1)%arr.length}}catch(e){$('rollstate').textContent='ROLL berhenti karena error: '+e.message}finally{rollRunning=false;$('roll').disabled=false;$('roll').textContent='ROLL';if(rollAbort)$('rollstate').textContent='ROLL dihentikan.';rollAbort=false}};
renderInputs();renderStatus([]);setLoginState('offline','Belum login');
</script></body></html>

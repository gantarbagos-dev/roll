<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MigMaster Roll</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}.card{background:#121a2d;border:1px solid #263454;border-radius:14px;padding:14px;margin-bottom:14px}h1{margin:0 0 12px;font-size:22px}h2{font-size:15px;margin:0 0 10px}input,button{height:42px;border-radius:9px;border:1px solid #33446c;background:#0d1425;color:#fff;padding:0 12px;font-size:14px}input{width:100%}button{cursor:pointer;font-weight:700}button:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;margin-bottom:8px;align-items:center}.num{color:#91a4cf;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.status{font-size:12px;color:#9fb0d5;margin-top:10px;min-height:18px}.list{max-height:280px;overflow:auto}.item{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #263454;font-size:13px}.ready{color:#65e6a7}.error{color:#ff8290}.roll{font-size:16px;width:100%;height:48px}.small{font-size:12px;color:#8fa1c7}.danger{border-color:#693544}</style></head><body><main>
<div class="card"><h1>MigMaster Roll</h1><div class="small">Array WebSocket mengikuti jumlah User ID yang diload.</div></div>
<div class="card"><h2>User ID</h2><div id="accounts"></div><div class="actions"><button id="add">TAMBAH ID</button><button id="save">SAVE</button><button id="load">LOAD</button><button id="login">LOGIN</button><button id="logout" class="danger">LOGOUT</button></div><div id="status" class="status"></div></div>
<div class="card"><h2>Room</h2><div class="grid"><input id="room" placeholder="Nama room"><input id="delay" type="number" min="0" value="1000" placeholder="Delay ms"></div><div class="actions" style="margin-top:8px"><button id="enter">ENTER ROOM</button><button id="leave">LEAVE ROOM</button></div></div>
<div class="card"><h2>CommandBox</h2><button id="roll" class="roll">ROLL</button><div class="small" style="margin-top:8px">ROLL: WebSocket 1 enter → leave → WebSocket 2 enter → leave → ... → terakhir, lalu kembali ke WebSocket 1.</div><div id="rollstate" class="status"></div></div>
<div class="card"><h2>WebSocket Array</h2><div id="wslist" class="list"></div></div>
</main><script>
const $=id=>document.getElementById(id);let accounts=[];let rollRunning=false;let rollAbort=false;
function renderInputs(){const box=$('accounts');box.innerHTML='';accounts.forEach((a,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="num">${i+1}</div><input data-u="${i}" placeholder="Username"><input data-p="${i}" type="password" placeholder="Password">`;box.appendChild(r);r.querySelector('[data-u]').value=a.username||'';r.querySelector('[data-p]').value=a.password||''});box.querySelectorAll('input').forEach(x=>x.oninput=()=>{const i=+x.dataset.u??+x.dataset.p;const idx=Number(x.dataset.u??x.dataset.p);if(x.dataset.u!==undefined)accounts[idx].username=x.value;else accounts[idx].password=x.value});}
function renderStatus(list){$('wslist').innerHTML=(list||[]).map((a,i)=>`<div class="item"><span>WebSocket ${i+1} — ${escapeHtml(a.username||'')}</span><span class="${a.status==='ready'?'ready':'error'}">${escapeHtml(a.status||'')}</span></div>`).join('')||'<div class="small">Belum ada WebSocket.</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('migmaster-roll-accounts',JSON.stringify(accounts));$('status').textContent='Data User ID tersimpan.'}
function load(){try{accounts=JSON.parse(localStorage.getItem('migmaster-roll-accounts')||'[]');if(!Array.isArray(accounts))accounts=[];renderInputs();$('status').textContent=`${accounts.length} User ID diload.`}catch{$('status').textContent='Data gagal diload.'}}
$('add').onclick=()=>{if(accounts.length>=50)return;accounts.push({username:'',password:''});renderInputs()};$('save').onclick=save;$('load').onclick=load;
$('login').onclick=async()=>{save();$('status').textContent='Membuka WebSocket sesuai jumlah User ID...';const r=await fetch('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accounts:accounts.filter(a=>a.username)})});const j=await r.json();renderStatus(j.accounts);$('status').textContent=`${j.count} WebSocket dibuat.`};
$('logout').onclick=async()=>{await fetch('/api/close',{method:'POST'});renderStatus([]);$('status').textContent='Semua WebSocket ditutup.'};
async function roomAction(action){const room=$('room').value.trim();if(!room){$('status').textContent='Isi nama room.';return}const r=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,room})});const j=await r.json();$('status').textContent=`${action.toUpperCase()}: ${j.sent||0} WebSocket dikirim.`}
$('enter').onclick=()=>roomAction('join');$('leave').onclick=()=>roomAction('leave');
const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms)));
$('roll').onclick=async()=>{if(rollRunning){rollAbort=true;return}const room=$('room').value.trim();if(!room){$('rollstate').textContent='Isi nama room terlebih dahulu.';return}const s=await fetch('/api/status').then(r=>r.json());const arr=s.accounts||[];if(!arr.length){$('rollstate').textContent='Belum ada WebSocket.';return}rollRunning=true;rollAbort=false;$('roll').textContent='STOP ROLL';const delay=Number($('delay').value)||0;let i=0;try{while(!rollAbort){const a=arr[i];$('rollstate').textContent=`WebSocket ${i+1}/${arr.length}: ENTER`;await fetch('/api/roll/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:a.id,room,action:'join'})});await sleep(delay);if(rollAbort)break;$('rollstate').textContent=`WebSocket ${i+1}/${arr.length}: LEAVE`;await fetch('/api/roll/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:a.id,room,action:'leave'})});await sleep(delay);i=(i+1)%arr.length}}finally{rollRunning=false;$('roll').textContent='ROLL';$('rollstate').textContent=rollAbort?'ROLL dihentikan.':'ROLL berjalan.';rollAbort=false}};
load();
</script></body></html>
